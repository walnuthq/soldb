name: Release

# Publishing a GitHub Release publishes the whole workspace to crates.io.
#
# The filename is load-bearing: crates.io trusted publishing authorizes this
# repository *and this workflow filename* for each of the twelve published
# crates. Renaming the file breaks publishing until every trusted-publisher
# config is updated to match.
#
# `soldb-wasm` sets `publish = false` and ships through `wasm-pack` instead, so
# `cargo publish --workspace` skips it.
#
# A crate added to the workspace does not publish from here on its first release.
# A trusted-publishing token cannot create a crate, so the upload fails with
# `403 Trusted Publishing tokens do not support creating new crates`, and that
# crate and everything downstream of it are left unpublished. Publishing it by
# hand before the release does not help either: it requires its siblings at the
# version being released, which are not on crates.io yet. Such a release is
# finished by hand from the release commit, with a token carrying the
# `publish-new` scope, and the new crate gets its owners and its
# trusted-publisher config (this repository, this filename, the `release`
# environment) so the next release publishes it from here. See the release
# section of CONTRIBUTING.md. `soldb-evm` was added in 0.3.0 and `soldb-tui` in
# 0.4.0, and both went this way.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Required to exchange a GitHub OIDC token for a short-lived crates.io token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check the tag matches the workspace version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "soldb") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag \`$GITHUB_REF_NAME\` does not match workspace version \`$version\`" >&2
            echo "bump the version in the workspace manifest, or retag the release" >&2
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --all-targets

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # `cargo publish --workspace` resolves the inter-crate publish order itself.
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
