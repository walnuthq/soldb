[package]
name = "soldb-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for SolDB: build traces, run debug sessions, and emit the web JSON document in a browser or Node.js host"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["development-tools::debugging", "wasm"]
# Distributed as an npm package built by `wasm-pack`, not through crates.io. The
# release workflow publishes the workspace and relies on this flag to skip the crate.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# The REVM replay backend, driven by the host in rounds through `Replay`. On by default
# so `cargo test --workspace` and the coverage gate exercise it; `make wasm` builds the
# lean package with `--no-default-features` and the replay-capable one with it on.
default = ["replay"]
replay = ["soldb-rpc/replay"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
soldb-core.workspace = true
soldb-debugger.workspace = true
soldb-ethdebug.workspace = true
# Without `replay` the package links no REVM: a WebAssembly host has no network to fetch
# state over, so only the transport types and trace assembly are reachable from here.
soldb-rpc = { path = "../soldb-rpc", version = "0.2.0", default-features = false }
soldb-serializer.workspace = true
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Size over speed for the published module: the debugger is bound by the size of the
# trace it reads, not by instruction throughput, and every kilobyte is downloaded.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[lints]
workspace = true
