[package]
name = "soldb-rpc"
version.workspace = true
edition.workspace = true
description = "JSON-RPC transport and the node-backed trace backends for SolDB"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[features]
default = ["replay"]
# The REVM replay backend: the engine in `soldb-evm` plus the node side here that fetches
# a transaction's inputs and reads parent-block state over RPC. Off, a build such as the
# WebAssembly package keeps the JSON-RPC transport and the `debug-rpc` backend without
# linking REVM.
replay = ["soldb-evm/replay"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
soldb-core.workspace = true
# The workspace entry turns the engine's default features off, so its `replay` feature
# follows ours instead of turning itself on underneath a transport-only build.
soldb-evm.workspace = true

[lints]
workspace = true
